name: build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 游戏直接调用 Win32 控制台 API,所以构建和测试都只能在 Windows 上跑。
      # g++ 取自 MSYS2 的 UCRT64 包,并把该环境的 bin 加进 PATH,好让下面的 pwsh 步骤直接调到。
      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Build
        shell: pwsh
        run: ./build.ps1

      # 测试脚本是重构链里的 PR 才加进来的,main 上暂时没有。
      # 所以在没有它的分支上跳过,合并之后会自动开始执行。
      - name: World logic tests
        shell: pwsh
        run: |
          if (-not (Test-Path ./run_tests.ps1)) {
            Write-Host "run_tests.ps1 is not on this branch yet - skipped"
            exit 0
          }
          ./run_tests.ps1

      - name: Upload the built executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PYS-windows
          path: PYS.exe
          if-no-files-found: error
